[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-bosonai"
dynamic = ["version"]
description = "LiveKit Agents plugin for Boson AI: Higgs Realtime and Higgs Avatar"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10.0"
authors = [{ name = "Boson AI" }]
keywords = ["voice", "ai", "realtime", "audio", "video", "avatar", "livekit", "boson"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "livekit-agents[openai]>=1.8.12,<2",
]

[project.urls]
Documentation = "https://docs.boson.ai"
Website = "https://www.boson.ai"
Source = "https://github.com/boson-ai/livekit-plugins-bosonai"

[tool.hatch.version]
path = "livekit/plugins/bosonai/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit", "/LICENSE", "/README.md"]
